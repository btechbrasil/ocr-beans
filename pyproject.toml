[project]
name = "ocr-beans"
version = "2.0.0"
description = "OCR de PDFs judiciais brasileiros e imagens + ferramentas de conversão de PDF (MCP, CLI, API web)"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0.0",
    "PyMuPDF>=1.24.0",
    "pytesseract>=0.3.10",
    "Pillow>=10.0.0",
    "anyio>=4.0.0",
    "pypdf>=4.0.0",
    "img2pdf>=0.5.0",
    "pdf2docx>=0.5.13",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "python-multipart>=0.0.9",
]

[project.scripts]
ocr-beans = "ocr_beans.cli:main"
ocr-beans-mcp = "ocr_beans.mcp_server:main"
ocr-beans-api = "ocr_beans.api:main"
